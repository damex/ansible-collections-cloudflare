---
name: sanity
on: # yamllint disable-line rule:truthy
  push:
    branches:
      - production
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  sanity:
    name: sanity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible_collections/damex/cloudflare
    steps:
      - uses: actions/checkout@v5
        with:
          path: ansible_collections/damex/cloudflare
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install --user pipenv
      - run: pipenv install --deploy
      - run: pipenv run sanity
