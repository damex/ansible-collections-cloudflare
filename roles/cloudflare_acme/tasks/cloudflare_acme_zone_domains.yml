---
- name: Ensure cloudflare acme certificate directory
  ansible.builtin.file:
    path: "{{ cloudflare_acme_zone_certificate_directory }}"
    mode: "0700"
    state: directory
    owner: "{{ cloudflare_acme_zone_user }}"
  become: true

- name: Ensure cloudflare acme account key
  community.crypto.openssl_privatekey:
    path: "{{ cloudflare_acme_zone_account_key_file }}"
    mode: "0640"
    passphrase: "{{ cloudflare_acme_zone_account_key_passphrase | default(omit) }}"
    cipher: auto
    owner: "{{ cloudflare_acme_zone_user }}"
  become: true

- name: Ensure cloudflare acme account
  community.crypto.acme_account:
    account_key: "{{ cloudflare_acme_zone_account_key_file }}"
    account_key_passphrase: "{{ cloudflare_acme_zone_account_key_passphrase | default(omit) }}"
    acme_version: "{{ cloudflare_acme_api_version }}"
    acme_directory: "{{ cloudflare_acme_zone_directory_url }}"
    terms_agreed: "{{ cloudflare_acme_terms_agreed }}"
    contact: "{{ ['mailto:' + cloudflare_acme_zone_account_email] if cloudflare_acme_zone_account_email is iterable else omit }}"
    state: present
  become: true
  become_user: "{{ cloudflare_acme_zone_user }}"

- name: Ensure cloudflare acme zone domain certificates
  ansible.builtin.include_tasks: cloudflare_acme_zone_domain_certificates.yml
  vars:
    cloudflare_acme_zone_domain_name: "{{ cloudflare_acme_zone_domain.name }}"
    cloudflare_acme_zone_domain_names: "{{ cloudflare_acme_zone_domain.names | default([]) }}"
    cloudflare_acme_zone_domain_deactivate_authzs: "{{ cloudflare_acme_zone_domain.deactivate_authzs | default(cloudflare_acme_zone_deactivate_authzs) }}"
  loop: "{{ cloudflare_acme_zone_domains }}"
  loop_control:
    label: "{{ cloudflare_acme_zone_domain_name }}"
    loop_var: cloudflare_acme_zone_domain
