---
- name: Ensure cloudflare email routing rule {{ cloudflare_email_routing_rule.name }}
  damex.cloudflare.cloudflare_email_routing_rule:
    name: "{{ cloudflare_email_routing_rule.name }}"
    zone_id: "{{ cloudflare_email_routing_zone_id | default(omit) }}"
    zone_name: "{{ cloudflare_email_routing_zone_name | default(omit) }}"
    account_email: "{{ cloudflare_email_routing_account_email | default(omit) }}"
    account_api_key: "{{ cloudflare_email_routing_account_api_key | default(omit) }}"
    api_token: "{{ cloudflare_email_routing_api_token | default(omit) }}"
    state: "{{ cloudflare_email_routing_rule.state | default(cloudflare_email_routing_rule_state) }}"
    enabled: "{{ cloudflare_email_routing_rule.enabled | default(cloudflare_email_routing_rule_enabled) }}"
    priority: "{{ cloudflare_email_routing_rule.priority | default(omit) }}"
    matchers: "{{ cloudflare_email_routing_rule.matchers }}"
    actions: "{{ cloudflare_email_routing_rule.actions }}"
